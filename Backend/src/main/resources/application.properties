spring.application.name=social

# =============================================================================
# 資料庫（ADR-002：MySQL）
# =============================================================================
# 帳密不寫死在原始碼中，以環境變數注入；未設定時使用括號後的預設值。
#   export DB_USERNAME=root
#   export DB_PASSWORD=your_password
#
# 資料庫與 Stored Procedure 請先執行 DB/ 下的三支腳本建立：
#   mysql -u root -p < DB/01_DDL.sql
#   mysql -u root -p < DB/02_DDL_stored_procedures.sql
#   mysql -u root -p < DB/03_DML.sql
spring.datasource.url=jdbc:mysql://localhost:3306/esunbank_social?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Taipei
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 資料層以 Stored Procedure 存取（需求 §6），故不使用 JPA/Hibernate。

# =============================================================================
# 登入驗證（ADR-003：Spring Security + JWT）
# =============================================================================
# JWT 簽章金鑰。HS256 要求至少 32 位元組。
#
# 刻意留空 fallback，與上方 spring.datasource.password 相同做法。
#
# 為什麼不給預設值：HS256 是對稱金鑰，簽發與驗證用同一把。金鑰一旦寫進版控，
# 任何拿到原始碼的人都能自行簽出合法憑證、冒充任意使用者，需求 §2 的身分驗證即形同虛設。
# 此非理論風險——已實測：以寫死的金鑰簽出 sub=1 的憑證，未經任何登入即成功發文。
#
# 未設定時 JwtTokenService 會改用啟動時隨機產生的金鑰並記錄 WARN，
# 應用程式仍可正常啟動；代價僅是重新啟動後既有憑證失效，需重新登入一次。
#
# 要讓憑證跨重啟有效，啟動前設定環境變數：
#   export APP_JWT_SECRET=$(openssl rand -base64 48)
app.jwt.secret=${APP_JWT_SECRET:}

# =============================================================================
# Web Server
# =============================================================================
server.port=8080
