spring.application.name=social

# =============================================================================
# 資料庫（ADR-002：MySQL）
# =============================================================================
# 帳密不寫死在原始碼中，以環境變數注入；未設定時使用括號後的預設值。
#   export DB_USERNAME=root
#   export DB_PASSWORD=your_password
#
# 資料庫與 Stored Procedure 請先執行 DB/ 下的三支腳本建立：
#   mysql -u root -p < DB/01_DDL.sql
#   mysql -u root -p < DB/02_DDL_stored_procedures.sql
#   mysql -u root -p < DB/03_DML.sql
spring.datasource.url=jdbc:mysql://localhost:3306/esunbank_social?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Taipei
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 資料層以 Stored Procedure 存取（題目 §6），故不使用 JPA/Hibernate。

# =============================================================================
# Web Server
# =============================================================================
server.port=8080
